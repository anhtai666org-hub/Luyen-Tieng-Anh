name: Nina Vocabulary Practice Render Keepalive
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Nina Vocabulary service
        run: |
          curl --fail --silent --show-error --max-time 60 https://luyentienganh.onrender.com/health || curl --fail --silent --show-error --max-time 60 https://luyentienganh.onrender.com/ || true
